<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuarios</title>
    <link rel="stylesheet" href="/Desenvolvimento De Sistemas/FrontEnd/style/style.css">
</head>
<body>
    <div class="container">
        <img src="https://placehold.co/200x100" alt="logo">
        <h2>Cadastro</h2>
        <form action="" id="cadastroForm">
            <input type="text" id="nome" placeholder="Nome" required>
            <input type="email" id="email" placeholder="E-mail" required>
            <input type="password" id="senha" placeholder="Senha" required>
            <button type="button" onclick="cadastrarUsuario()">Cadastrar</button>
        </form>
        <a href="usuarios.html" class="link-usuarios">Ver usuários cadastrados</a>
    </div>
    <div id="mensagem" class="mensagem oculto" onclick="fecharMesagem()" hidden></div>
    <script src="/Desenvolvimento De Sistemas/FrontEnd/script.js"></script>
</body>
</html>
